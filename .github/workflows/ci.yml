name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: Build, type-check, lint, validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit -p tsconfig.local.json

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate Cursor skill figma_* refs vs registerTool
        run: npm run validate:fmcp-skills

      - name: Version consistency check (package.json, version.ts, plugin.json ×2, manifest.json, ui.html)
        run: npm run check:versions

      - name: fmcp CLI smoke (degraded serve answers initialize without node_modules deps)
        run: |
          node dist/cli/fmcp.js version
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | FMCP_FORCE_DEGRADED=1 timeout 10 node dist/cli/fmcp.js serve | grep -q '"serverInfo"'

      - name: Security audit
        run: npm audit --omit=dev || true
