name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: Build, test, lint, validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit -p tsconfig.local.json

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Checks below are platform-independent — run them once
      - name: Formatting (biome format) and lint errors (biome lint)
        if: matrix.node == '22'
        run: |
          npx biome format src
          npx biome lint src

      - name: Committed dist/ matches the source
        if: matrix.node == '22'
        run: |
          git diff --exit-code -- dist || (echo "FAIL: dist/ is stale — run 'npm run build' and commit dist/" && exit 1)

      - name: Embedded skills are regenerated
        if: matrix.node == '22'
        run: |
          npm run generate:embedded-skills
          git diff --exit-code -- src/core/embedded-skills.ts || (echo "FAIL: run 'npm run generate:embedded-skills' and commit" && exit 1)

      - name: Tool names in skills/commands/docs match registerTool
        if: matrix.node == '22'
        run: npm run validate:fmcp-skills

      - name: Version stamps and counts are in sync
        if: matrix.node == '22'
        run: npm run check:versions

      - name: Security audit (production dependencies)
        if: matrix.node == '22'
        run: npm audit --omit=dev --audit-level=high
